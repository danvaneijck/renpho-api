[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renpho-api"
version = "0.5.0"
description = "Unofficial Python client for the Renpho Health API — pull body composition data from Renpho smart scales and body girth data from smart tape measures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "danvaneijck" }]
keywords = [
    "renpho",
    "health",
    "body-composition",
    "smart-scale",
    "tape-measure",
    "girth",
    "api-client",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # The CA bundle that requests uses. 2026.10.19 removed the distrusted
    # emSign (eMudhra) roots and restored the unaffected ones. Floor suggested
    # by @ChocoTonic in the renpho-py fork.
    "certifi>=2026.10.19",
    "requests>=2.28",
    "pycryptodome>=3.15",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
# ruff is pinned exactly: new releases add lint rules and would otherwise
# break CI without any change here.
dev = ["pytest>=7.0", "ruff==0.17.3"]

[project.urls]
Repository = "https://github.com/danvaneijck/renpho-api"

[project.scripts]
renpho = "renpho.cli:main"

# Explicit, because flat-layout auto-discovery also picks up the CLI's default
# output folder (renpho_data/) once it exists and then refuses to build.
[tool.setuptools]
packages = ["renpho"]

[tool.setuptools.package-data]
renpho = ["py.typed"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade. Line length is
# left to review rather than enforced.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
